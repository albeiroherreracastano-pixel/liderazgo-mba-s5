<head>

<title>Kit digital · Sesión 5 · Estilos y Teorías del Liderazgo</title>
<style>
:root{--navy:#1F2A5C;--blue:#2C5697;--gold:#B8891C;--green:#3E8E7E;--bg:#F6F8FB;--card:#fff;--line:#E2E8F0;--muted:#5B6576;--soft:#EEF2F8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1E2533;line-height:1.5;font-size:16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 0;position:sticky;top:0;z-index:20}
.brand{font-size:.72rem;color:var(--blue);font-weight:700;letter-spacing:.04em}
.brand b{color:var(--navy)}
.who{font-size:.8rem;color:var(--muted);margin-top:2px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.35rem;color:var(--navy);margin-bottom:4px}
h2{font-size:1.1rem;color:var(--navy);margin:18px 0 8px}
h3{font-size:1rem;color:var(--navy);margin:14px 0 6px}
p{margin-bottom:8px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.note{background:#FFF8E6;border:1px solid #F1D48A;border-radius:12px;padding:12px;font-size:.92rem;margin-bottom:12px}
.info{background:var(--soft);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-bottom:12px}
label{display:block;font-weight:600;color:var(--navy);font-size:.92rem;margin:10px 0 4px}
textarea,input[type=text],select{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:10px;font-size:1rem;font-family:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 16px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--navy);color:#fff}
.btn-s{background:#fff;color:var(--navy);border:1px solid #CBD5E1}
.btn-g{background:#E9F6F2;color:#1F6B5C;border:1px solid #A9DCCD}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px;font-weight:700;color:var(--navy);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.scale{display:flex;gap:6px;margin-top:6px}
.scale button{flex:1;border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:9px 0;font-weight:700;color:var(--navy);cursor:pointer;font-size:1rem}
.scale button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .q{font-size:.95rem}
.item .n{color:var(--gold);font-weight:800;margin-right:4px}
.legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:3px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0}
.bar .lbl{width:104px;font-size:.88rem;font-weight:700;color:var(--navy)}
.bar .track{flex:1;height:22px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--blue)}
.bar .val{width:34px;text-align:right;font-weight:800;color:var(--navy)}
.zone{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;padding:8px;border-radius:10px;margin-bottom:6px;background:#fff;border:1px solid var(--line)}
.zone .f{font-weight:800;color:var(--gold);font-size:.85rem}
.zone .z{font-weight:700;color:var(--navy)}
.zone .t{font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
th{background:var(--navy);color:#fff;text-align:left;padding:7px}
td{border-bottom:1px solid var(--line);padding:7px;vertical-align:top}
tr.hi td{background:#FFF8E6}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700}
.color-box{border-radius:14px;padding:16px;text-align:center;color:#fff;font-weight:800;font-size:1.15rem}
.big-num{font-size:1.6rem;font-weight:800;color:var(--navy)}
.hidden{display:none}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;display:none;z-index:50}
.profile p{font-size:1rem}
.small{font-size:.82rem;color:var(--muted)}
.num-in{width:80px!important;text-align:center;font-size:1.1rem!important;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>

function shape(r){
 const arr=STYLES.map(s=>({id:s.id,name:s.name,v:r[s.id]})).sort((a,b)=>b.v-a.v);
 const out=[];const max=arr[0],min=arr[5];
 if(max.v-min.v<5) out.push(['Perfil plano','Menos de 5 puntos entre el estilo más alto y el más bajo. Puede ser un repertorio amplio, o respuestas pensadas en lo que "debería" hacer.','¿Respondí pensando en mi semana más difícil o en mi mejor versión?']);
 if(max.v-arr[1].v>=5) out.push(['Perfil con un pico',`${max.name} está 5 o más puntos por encima del siguiente. Puede ser tu estilo de refugio: el que aparece cuando no hay tiempo de pensar.`,'¿Qué pasa en mi equipo cuando uso ese estilo todo el tiempo?']);
 arr.filter(a=>a.v<=12).forEach(a=>out.push([`Un valle en ${a.name}`,`Está en ${a.v}: es un estilo casi ausente. No es un defecto; es un riesgo cuando la situación lo pida.`,'¿Qué situación reciente me pedía este estilo y no lo usé?']));
 const top2=[arr[0].id,arr[1].id];
 if(top2.includes('coe')&&top2.includes('mar')) out.push(['Coercitivo y Marcapasos arriba','Bajo presión, el clima del equipo tiende a deteriorarse (Goleman: −0,26 y −0,25).','¿Quién de mi equipo paga el costo de mi exigencia?']);
 if(top2.includes('afi')&&top2.includes('dem')&&r.coe<=14) out.push(['Afiliativo y Democrático arriba, Coercitivo abajo','Buen clima, pero riesgo de evitar el conflicto o de tardar en decidir.','¿Qué decisión difícil estoy posponiendo?']);
 if(!out.length) out.push(['Perfil escalonado','Tus estilos se reparten sin extremos marcados. Mira cuál usas bajo presión: suele ser distinto del más alto.','¿Cuál de mis estilos aparece primero cuando me presionan?']);
 return {arr,out}}

  <div class="info"><b>Cómo presentan (6 min):</b> 1) actúan la escena del primer estilo sin nombrarlo y la sala adivina; 2) lo mismo con el segundo; 3) explican los dos y la tensión entre ellos.</div>`}
 return `<h1>Hilo 3 · Investigación y desafíos</h1>
 <div class="card"><h3>Mi grupo de investigación</h3><div class="tabs" id="itabs">${Object.keys(KITS).map(k=>`<button data-g="${k}" class="${g===k?'on':''}">${k}</button>`).join('')}</div></div>${body}
 <h2>Desafíos · Mesa de mezclas</h2>
 ${DESAFIOS.map((d,i)=>`<div class="card"><h3>${d[0]}</h3><p>${d[1]}</p></div>`).join('')}
 <div class="card"><h3>La mezcla de mi grupo</h3>${sel('mez_des','Desafío',DESAFIOS.map(d=>d[0]))}
 <div class="grid2">${sel('mez_a1','Arriba',STYLES.map(s=>s.name))}${sel('mez_a2','Arriba',STYLES.map(s=>s.name))}</div>${sel('mez_b','Abajo',STYLES.map(s=>s.name))}${ta('mez_pq','Por qué')}</div>
 <div class="card"><h3>Y mi situación real</h3><p class="small">Esta línea la vas a usar al final de la noche.</p>${ta('real_sit','La situación')}
 <div class="grid2">${sel('real_a1','Arriba',STYLES.map(s=>s.name))}${sel('real_a2','Arriba',STYLES.map(s=>s.name))}</div>${sel('real_b','Abajo',STYLES.map(s=>s.name))}</div>`}

function viewCaso(){
 const name=v('nombre');
 if(!name) return `<h1>Hilo 4</h1><div class="note">Primero elige tu nombre en <b>Inicio</b>.</div>`;
 const ver=ESTUDIANTES[name]||'A';const fem=ver==='A';
 const N=fem?'Daniela Restrepo':'Daniel Restrepo';const P=fem?'Daniela':'Daniel';
 const done=v('caso_ok');
 afterHooks.push(()=>{const b=document.getElementById('casoOk');if(b)b.onclick=()=>{const need=['k_comp','k_simp','k_conf','k_contr','k_d1','k_d2','k_d3'];if(need.some(k=>!v(k))){toast('Completa todas las calificaciones');return}setv('caso_ok',true);render()}});
 const num=(k,l)=>`<div class="bar"><div class="lbl" style="width:auto;flex:1">${l}</div><input type="text" inputmode="numeric" class="num-in" data-k="${k}" value="${esc(v(k))}" ${done?'disabled':''}></div>`;
 const colorBox=done?`<div class="color-box" style="background:${fem?'#2C5697':'#3E8E7E'}">Tu color es ${fem?'AZUL':'VERDE'}</div>
  <div class="card" style="margin-top:12px"><p>Cuando el profesor lo pida, di en voz alta solo estos tres números:</p>
  <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;text-align:center"><div><div class="big-num">${esc(v('k_simp'))}</div><div class="small">Simpatía</div></div><div><div class="big-num">${esc(v('k_conf'))}</div><div class="small">Confianza</div></div><div><div class="big-num">${esc(v('k_d1'))}</div><div class="small">Decisión 1</div></div></div>
  <p class="small" style="margin-top:8px">Y tus tres adjetivos: <b>${esc(v('k_adj'))}</b></p></div>`:'';
 return `<h1>Hilo 4 · Perfil de un líder</h1><div class="info">Léelo solo. No lo compares con el celular de tu vecino.</div>
 <div class="card profile"><h2 style="margin-top:0">${N}</h2><p class="small">Gerente general · Tiendas Alcora, cadena regional de tiendas de barrio, Eje Cafetero</p>
 <p>${P} tiene 44 años. Entró a Tiendas Alcora en 2014 como ${fem?'jefa':'jefe'} de compras, cuando la cadena tenía tres tiendas. Hoy la empresa tiene 40 tiendas, 620 empleados y ventas cercanas a 180.000 millones de pesos al año. Es ${fem?'conocida':'conocido'} en el sector por su red de contactos con proveedores y por haber negociado personalmente, en 2022, una alianza con una cadena nacional de droguerías.</p>
 <p><b>Tres decisiones marcaron su gestión:</b></p>
 <p><b>1. La crisis.</b> En abril de 2020 cerró seis tiendas en una semana, sin consultar a la junta ni al equipo directivo, para proteger la caja. Varios gerentes de tienda se enteraron por correo. La empresa no tuvo que despedir a nadie más ese año.</p>
 <p><b>2. Las cifras de los lunes.</b> Desde 2021 exige a cada gerente de tienda un reporte de resultados todos los lunes a las 8:00 a. m. Los revisa en una reunión general en la que corrige en público a quien no cumplió la meta.</p>
 <p><b>3. Las visitas.</b> En 2022, al ver que la rotación de personal había llegado al 18%, pasó tres meses visitando cada tienda: conversó con cajeros y bodegueros, escuchó quejas y reorganizó turnos. Al año siguiente la rotación bajó al 9%.</p>
 <p>Sus colaboradores ${fem?'la':'lo'} describen como "${fem?'directa':'directo'}" y "muy exigente". Dos de sus antiguos gerentes trabajan hoy en la competencia.</p></div>
 <div class="card"><h2>Tu calificación (1 a 10)</h2><p class="small">Primera impresión.</p>
 ${num('k_comp','Competencia')}${num('k_simp','Simpatía')}${num('k_conf','Confianza que le genera')}${num('k_contr',`¿${fem?'La':'Lo'} contrataría para dirigir su empresa?`)}
 <h3>¿Qué tan apropiada fue cada decisión?</h3>${num('k_d1','1. Cerrar seis tiendas sin consultar')}${num('k_d2','2. Corregir en público los lunes')}${num('k_d3','3. Visitar cada tienda tres meses')}
 ${tx('k_adj',`Tres adjetivos para describir a ${P}`)}
 ${done?'':'<div class="row"><button class="btn btn-p" id="casoOk">Listo</button></div>'}</div>${colorBox}
 <div class="card"><h2>Voces cruzadas</h2><p>Escribe tu frase en el post-it, sin nombre, y échalo en la bolsa:</p><p>• Mujeres: <b>"A un hombre que lidera no se le permite…"</b><br>• Hombres: <b>"A una mujer que lidera no se le permite…"</b><br>• Si no quieres ubicarte en ninguno de los dos lados, escribe las dos.</p></div>`}

function viewEspejo(){
 const {r,n}=scores();
 const rows=STYLES.map(s=>`<tr><td><b>${s.name}</b></td><td>${n===30?r[s.id]:'—'}</td><td><input type="text" inputmode="numeric" class="num-in" style="width:56px!important" data-k="e_mas_${s.id}" value="${esc(v('e_mas_'+s.id))}"></td><td><input type="text" inputmode="numeric" class="num-in" style="width:56px!important" data-k="e_nun_${s.id}" value="${esc(v('e_nun_'+s.id))}"></td></tr>`).join('');
 return `<h1>Hilo 5 · El espejo</h1>
 <div class="card"><h2>El círculo</h2><p>Cada compañero te dice, cara a cara:</p><p><b>"El estilo que más te veo aquí es ___, por ejemplo cuando ___."</b><br><b>"El que nunca te he visto es ___."</b></p><p class="small">Tú solo escuchas y anotas. Al final puedes decir "gracias", nada más.</p></div>
 <div class="card" style="overflow-x:auto"><h2>Mi mapa de brecha</h2><p class="small">Anota cuántos compañeros mencionaron cada estilo.</p>
 <table><tr><th>Estilo</th><th>Mi puntaje</th><th>"Más te veo"</th><th>"Nunca te he visto"</th></tr>${rows}</table>
 ${ta('e_coincide','Lo que coincide')}${ta('e_ciego','Mi punto ciego: los demás lo ven y yo me califiqué bajo')}${ta('e_fachada','Mi fachada: yo me califiqué alto y aquí nadie lo ve')}</div>
 <div class="note"><b>Tríos de la verdad.</b> Di en voz alta frente a tus dos compañeros:<br><br>"El estilo que ejerzo <b>por comodidad</b> es ___."<br>"El estilo que evito <b>por inseguridad</b> es ___, y lo evito porque ___."<br><br>Cada compañero puede hacer una sola pregunta. Sin consejos.</div>
 <div class="card">${ta('e_pregunta','La pregunta que más me movió')}</div>`}

function viewTaller(){
 return `<h1>Mi taller · Sesión 5</h1>
 <div class="info">El taller tiene tres partes, en el mismo orden de la rúbrica. La parte 1 ya está en las secciones anteriores; aquí completas las partes 2 y 3. Todo queda junto en <b>Mi resumen</b>. Entrega: viernes 20 de noviembre.</div>
 <div class="card"><h2>1 · Producto de la sesión (40%)</h2><p class="small">Tu perfil de estilos, tu mapa de brecha y tu práctica deliberada. Se toma de las secciones 3, 5 y 6.</p></div>
 <div class="card"><h2>2 · Ficha de aprendizaje (30%)</h2>
 ${ta('t_aprend','Un aprendizaje de esta sesión')}
 ${ta('t_practica','Una buena práctica que puedo aplicar en mi organización')}
 ${ta('t_comp','Un compromiso con fecha','Qué voy a hacer, con quién y para cuándo')}</div>
 <div class="card"><h2>3 · Seguimiento del compromiso de la Sesión 4 (30%)</h2>
 <p class="small">La parte del trabajo que devolviste en la S4.</p>
 ${ta('t4_que','Qué parte del trabajo devolví, a quién y con qué nivel de autonomía (1 a 7)')}
 ${sel('t4_cumpli','¿Cumplí el compromiso?',['Sí','En parte','No'])}
 ${ta('t4_paso','Qué pasó: los hechos, no mis interpretaciones')}
 ${ta('t4_revela','Si no lo cumplí o lo cumplí en parte: por qué, y qué revela eso de mi liderazgo')}
 <div class="note">Si no cumpliste, dilo. Un análisis honesto de por qué no lo cumpliste puede llegar a 3,5 en este criterio. Un reporte maquillado no suma.</div></div>`}
function practicaTexto(){
 return `MI PRÁCTICA DELIBERADA · Sesión 5 · ${v('nombre')}\n\n(a) Estilo que voy a practicar: ${v('p_a')}\n(b) Situación real (con quién y cuándo): ${v('p_b')}\n(c) Conducta y frase de apertura: ${v('p_c')}\n(d) Intento 1: miércoles 11 de noviembre. Repeticiones 2 y 3: antes del martes 17.\n(e) Señal de que funcionó: ${v('p_e')}\n(f) Frase de mi primer maestro que me va a querer sacar de ahí: ${v('p_f')}\n(g) Quién me dará retroalimentación: ${v('p_g')}\n\nEnsayo: calificación ${v('p_cal')}/5 · Ajuste: ${v('p_aj')}\n\nTestigo: ${v('p_testigo')}`}
function viewPractica(){
 afterHooks.push(()=>{document.getElementById('cpP').onclick=()=>copyText(practicaTexto());document.getElementById('waP').onclick=e=>{e.currentTarget.href=waLink(practicaTexto()+'\n\nTe nombro mi testigo. ¿Me preguntas el miércoles cómo me fue?')}});
 return `<h1>Hilo 6 · El estilo que voy a practicar</h1>
 <div class="note"><b>Regla:</b> el estilo sale de lo que nunca te han visto, de tu fachada o del estilo que evitas. Nunca del dominante. Si la parte del trabajo que devolviste en la S4 sigue abierta, practica ahí.</div>
 <div class="card">${sel('p_a','(a) El estilo que voy a practicar',STYLES.map(s=>s.name))}
 ${ta('p_b','(b) La situación real: con quién y cuándo',v('real_sit'))}
 ${ta('p_c','(c) Lo que voy a hacer distinto, y la frase textual con la que voy a abrir')}
 <div class="info">(d) <b>Primer intento: mañana, miércoles 11 de noviembre,</b> en tu trabajo. Lo contamos al abrir la S6. Dos repeticiones más antes de la S7 (martes 17).</div>
 ${ta('p_e','(e) La señal en la otra persona que me dirá si funcionó')}
 ${ta('p_f','(f) La frase de mi primer maestro que me va a querer sacar de ahí',v('m1_frase'))}
 ${tx('p_g','(g) Quién me dará retroalimentación en mi trabajo')}</div>
 <div class="card"><h2>Ensayo relámpago</h2><p class="small">Di tu frase en voz alta con el estilo nuevo. Tu compañero te califica.</p>
 ${sel('p_cal','¿Sonó a ese estilo? (1 a 5)',['1','2','3','4','5'])}${ta('p_aj','El ajuste que me propuso')}</div>
 <div class="card"><h2>Mi testigo</h2>${tx('p_testigo','Nombre de mi compañero testigo')}
 <p class="small">Envíale tu tarjeta por WhatsApp: ese mensaje es la firma.</p>
 <div class="row"><a class="btn btn-g" id="waP" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn btn-s" id="cpP">Copiar</button></div></div>`}

function resumenTexto(){
 const {r,n}=scores();
 let t=`TALLER · SESIÓN 5 · Estilos y Teorías del Liderazgo\n${v('nombre')}\n\n1 · PRODUCTO DE LA SESIÓN\n\n`;
 t+=`DEBATE\nNúmero al inicio: ${v('num_ini')} · al cierre: ${v('num_fin')} · Grupo: ${v('grupoDebate')}\n\n`;
 t+=`MIS MAESTROS\n1. Primer maestro (${v('m1_donde')}): "${v('m1_frase')}" → ${v('m1_zona')}\n2. Primer jefe: "${v('m2_frase')}" → ${v('m2_zona')}\n3. El jefe que más me marcó: "${v('m3_frase')}" → ${v('m3_zona')}\nPrimer cargo: ${v('c1')} · Hoy: ${v('c2')}\n${v('c_preg')}\n\n`;
 t+=`MI PERFIL${n<30?' (incompleto)':''}\n`+STYLES.map(s=>`${s.name}: ${r[s.id]}`).join(' · ')+`\nMás natural: ${v('r_nat')} · Bajo presión: ${v('r_pres')} · Menos usado: ${v('r_menos')}\n${v('r_sit')}\n${v('r_maestro')}\n\n`;
 t+=`ESPEJO\n`+STYLES.map(s=>`${s.name}: más te veo ${v('e_mas_'+s.id,'0')} · nunca ${v('e_nun_'+s.id,'0')}`).join('\n')+`\nCoincide: ${v('e_coincide')}\nPunto ciego: ${v('e_ciego')}\nFachada: ${v('e_fachada')}\nPregunta que me movió: ${v('e_pregunta')}\n\n`;
 t+=practicaTexto();
 t+=`\n\n2 · FICHA DE APRENDIZAJE\nAprendizaje: ${v('t_aprend')}\nBuena práctica para mi organización: ${v('t_practica')}\nCompromiso con fecha: ${v('t_comp')}`;
 t+=`\n\n3 · SEGUIMIENTO DEL COMPROMISO DE LA SESIÓN 4\nQué devolví, a quién y con qué autonomía: ${v('t4_que')}\n¿Cumplí?: ${v('t4_cumpli')}\nQué pasó: ${v('t4_paso')}\nPor qué y qué revela de mi liderazgo: ${v('t4_revela')}`;
 return t}
function viewResumen(){
 const txt=resumenTexto();
 afterHooks.push(()=>{document.getElementById('cpR').onclick=()=>copyText(txt);document.getElementById('waR').href=waLink(txt)});
 const obsUrl=location.href.split('#')[0]+'#observador';
 return `<h1>Mi resumen</h1><div class="info">Este texto es tu taller completo de la Sesión 5, en el orden de la rúbrica. Revisa que <b>Mi taller</b> esté lleno, cópialo y entrégalo a más tardar el viernes 20 de noviembre. También puedes enviártelo por WhatsApp.</div>
 <div class="row"><button class="btn btn-p" id="cpR">Copiar todo</button><a class="btn btn-g" id="waR" href="#" target="_blank" rel="noopener">Enviarme por WhatsApp</a></div>
 <div class="card" style="margin-top:12px;white-space:pre-wrap;font-size:.85rem">${esc(txt)}</div>
 <div class="card"><h2>Tarea para la Sesión 8 · 360°</h2><p>Envía este enlace a tres personas de tu trabajo (un jefe o par, un colaborador y alguien de tu elección). Responden en su celular y te envían su resultado.</p>
 <p style="word-break:break-all;background:#EEF2F8;padding:8px;border-radius:8px;font-size:.85rem">${esc(obsUrl)}</p>
 <div class="row"><button class="btn btn-s" id="cpO">Copiar enlace</button></div></div>`}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='cpO'){copyText(location.href.split('#')[0]+'#observador')}});

/* ---------- observador ---------- */
let O={};try{O=JSON.parse(localStorage.getItem('kitS5obs')||'{}')}catch(e){O={}}
function saveO(){try{localStorage.setItem('kitS5obs',JSON.stringify(O))}catch(e){}}
function viewObservador(){
 return `<h1>Mirada de un observador</h1><p class="sub">Liderazgo y Dirección de Equipos e Individuos · MBA · Pontificia Universidad Javeriana</p>
 <div class="info">Una persona de tu trabajo está en un programa de formación en liderazgo y te pide tu mirada honesta. Piensa en lo que le has visto hacer en los últimos tres meses, sobre todo bajo presión. No hay respuestas buenas o malas.</div>
 <div class="card"><label>¿A quién estás evaluando? (nombre)</label><input type="text" id="oName" value="${esc(O.name||'')}">
 <label>Tu relación con esa persona</label><select id="oRel"><option value="">Elegir…</option>${['Jefe','Par','Colaborador','Otro'].map(x=>`<option ${O.rel===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <p class="small">Cada frase describe a la persona que evalúas. 1 Casi nunca · 2 Pocas veces · 3 Algunas veces · 4 Frecuentemente · 5 Casi siempre</p>
 <div class="card">${OBS.map((t,k)=>{const i=k+1;return `<div class="item"><div class="q"><span class="n">${i}.</span>${t}</div><div class="scale">${[1,2,3,4,5].map(x=>`<button data-i="${i}" data-v="${x}" class="${O['a'+i]===x?'on':''}">${x}</button>`).join('')}</div></div>`}).join('')}</div>
 <button class="btn btn-p" id="oDone">Ver resultado</button><div id="oRes"></div>`}
function obsResult(){
 const r={};STYLES.forEach(s=>{r[s.id]=s.items.reduce((a,i)=>a+(O['a'+i]||0),0)});
 const txt=`Mirada de observador (${O.rel||'—'}) sobre ${O.name||'—'}:\n`+STYLES.map(s=>`${s.name}: ${r[s.id]}`).join('\n');
 document.getElementById('oRes').innerHTML=`<div class="card" style="margin-top:12px"><h2>Resultado</h2>${STYLES.map(s=>`<div class="bar"><div class="lbl">${s.name}</div><div class="track"><div class="fill" style="width:${Math.max(4,(r[s.id]-5)/20*100)}%"></div></div><div class="val">${r[s.id]}</div></div>`).join('')}
 <p>Envía este resultado a la persona evaluada:</p><div class="row"><a class="btn btn-g" href="${waLink(txt)}" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn btn-s" id="oCp">Copiar</button></div></div>`;
 document.getElementById('oCp').onclick=()=>copyText(txt)}
function bindObs(){
 document.getElementById('oName').oninput=e=>{O.name=e.target.value;saveO()};
 document.getElementById('oRel').onchange=e=>{O.rel=e.target.value;saveO()};
 document.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{O['a'+b.dataset.i]=+b.dataset.v;saveO();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
 document.getElementById('oDone').onclick=()=>{const n=OBS.filter((_,k)=>O['a'+(k+1)]).length;if(n<30){toast(`Faltan ${30-n} respuestas`);return}obsResult()};
}

/* ---------- arranque ---------- */
function fromHash(){const h=(location.hash||'').replace('#','');if(h==='observador'||VIEWS.some(x=>x[0]===h))cur=h;render()}
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
